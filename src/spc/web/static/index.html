<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-i18n="app.title">SPC</h1>
    <p data-i18n="app.subtitle"></p>
  </div>
  <div class="userbar">
    <div id="userbox" class="row" hidden>
      <span id="user-label" class="strong"></span>
      <button id="pw-btn" data-i18n="user.change_password"></button>
      <button id="logout-btn" data-i18n="user.logout"></button>
    </div>
    <label class="lang">
      <span data-i18n="app.language"></span>
      <select id="lang">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
</header>

<div id="errors" class="errors" role="alert" hidden></div>
<div id="busy" class="busy" hidden data-i18n="app.loading"></div>

<section id="login" class="panel narrow" hidden>
  <h2 data-i18n="login.title"></h2>
  <p id="login-setup" class="note" hidden data-i18n="login.setup_needed"></p>
  <p id="login-msg" class="note" hidden></p>
  <form id="login-form">
    <div class="form-grid">
      <label class="wide"><span data-i18n="login.username"></span>
        <input id="login-user" type="text" autocomplete="username" maxlength="64" required></label>
      <label class="wide"><span data-i18n="login.password"></span>
        <input id="login-pass" type="password" autocomplete="current-password" maxlength="1024" required></label>
    </div>
    <p><button class="primary" type="submit" data-i18n="login.submit"></button></p>
  </form>
</section>

<div id="app" hidden>
<p class="notice" data-i18n="app.notice"></p>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="import" data-needs="engineer" aria-selected="true" data-i18n="nav.import"></button>
  <button role="tab" data-tab="data" aria-selected="false" aria-disabled="true" data-i18n="nav.data"></button>
  <button role="tab" data-tab="analysis" aria-selected="false" aria-disabled="true" data-i18n="nav.analysis"></button>
  <button role="tab" data-tab="monitor" aria-selected="false"><span data-i18n="nav.monitor"></span> <span id="alert-badge" class="badge" hidden></span></button>
  <button role="tab" data-tab="saved" aria-selected="false" data-i18n="nav.saved"></button>
  <button role="tab" data-tab="tools" aria-selected="false" data-i18n="nav.tools"></button>
  <button role="tab" data-tab="admin" data-needs="admin" aria-selected="false" data-i18n="nav.admin"></button>
</nav>

<main>
<!-- 1. import -->
<section id="tab-import" class="panel" data-needs="engineer">
  <h2 data-i18n="import.title"></h2>
  <p data-i18n="import.intro"></p>
  <p>
    <label class="filebtn">
      <input type="file" id="file" accept=".csv,.txt,text/csv">
      <span data-i18n="import.choose"></span>
    </label>
    <span id="file-name" class="muted" data-i18n="import.no_file"></span>
  </p>
  <div id="import-form" hidden>
    <p id="detected" class="muted"></p>
    <h3 data-i18n="import.preview"></h3>
    <div class="scroll"><table id="preview" class="grid"></table></div>
    <div class="form-grid">
      <label><span data-i18n="import.col_value"></span><select id="col-value"></select></label>
      <label><span data-i18n="import.col_subgroup"></span><select id="col-subgroup"></select></label>
      <label><span data-i18n="import.col_timestamp"></span><select id="col-timestamp"></select></label>
      <label><span data-i18n="import.decimal"></span>
        <select id="decimal">
          <option value="." data-i18n="import.decimal_point"></option>
          <option value="," data-i18n="import.decimal_comma"></option>
        </select></label>
      <label><span data-i18n="import.missing"></span>
        <select id="missing">
          <option value="error" data-i18n="import.missing_error"></option>
          <option value="skip" data-i18n="import.missing_skip"></option>
        </select></label>
    </div>
    <fieldset>
      <legend data-i18n="import.col_tags"></legend>
      <div id="col-tags" class="checks"></div>
    </fieldset>
    <details>
      <summary data-i18n="analysis.advanced"></summary>
      <div class="form-grid">
        <label><span data-i18n="import.col_valid"></span><select id="col-valid"></select></label>
        <label><span data-i18n="import.col_reason"></span><select id="col-reason"></select></label>
        <label><span data-i18n="import.col_by"></span><select id="col-by"></select></label>
        <label><span data-i18n="import.col_at"></span><select id="col-at"></select></label>
        <label><span data-i18n="import.col_source_row"></span><select id="col-source-row"></select></label>
      </div>
    </details>
    <p><button id="import-btn" class="primary" data-i18n="import.submit"></button></p>
  </div>
</section>

<!-- 2. data -->
<section id="tab-data" class="panel" hidden>
  <h2 data-i18n="data.title"></h2>
  <p id="data-counts" class="strong"></p>
  <p id="data-source" class="muted"></p>
  <ul id="data-warnings" class="warnings"></ul>

  <div class="card">
    <h3 data-i18n="data.suspects_title"></h3>
    <p class="note" data-i18n="data.suspects_note"></p>
    <div class="row">
      <label><span data-i18n="data.method"></span>
        <select id="suspect-method">
          <option value="mad" data-i18n="data.method_mad"></option>
          <option value="tukey" data-i18n="data.method_tukey"></option>
          <option value="grubbs" data-i18n="data.method_grubbs"></option>
        </select></label>
      <button id="suspect-btn" data-i18n="data.find"></button>
      <button id="suspect-select" hidden data-i18n="data.select_suspects"></button>
    </div>
    <p id="suspect-msg" class="muted"></p>
  </div>

  <div class="card">
    <h3 data-i18n="data.mark_title"></h3>
    <p id="selected-count" class="muted"></p>
    <div data-needs="engineer">
      <div class="form-grid">
        <label class="wide"><span data-i18n="data.reason"></span>
          <input id="reason" type="text" maxlength="2000" data-i18n-placeholder="data.reason_hint"></label>
      </div>
      <p id="person-note" class="muted"></p>
    </div>
    <p class="row">
      <button id="mark-btn" class="primary" data-needs="engineer" data-i18n="data.mark"></button>
      <button id="restore-btn" data-needs="engineer" data-i18n="data.restore"></button>
      <a id="export-link" class="button" download data-i18n="data.export"></a>
      <a id="export-xlsx-link" class="button" download data-i18n="data.export_xlsx"></a>
    </p>
  </div>

  <div class="card" data-needs="engineer">
    <h3 data-i18n="data.restart_title"></h3>
    <p class="note" data-i18n="data.restart_note"></p>
    <p id="restart-list" class="muted"></p>
    <label class="check"><input type="checkbox" id="restart-phase"> <span data-i18n="data.restart_phase"></span></label>
    <p class="row">
      <button id="restart-btn" data-i18n="data.restart_btn"></button>
      <button id="unrestart-btn" data-i18n="data.unrestart_btn"></button>
    </p>
  </div>

  <div class="scroll"><table id="rows" class="grid"></table></div>
  <p class="row">
    <button id="prev" data-i18n="data.prev"></button>
    <span id="page-info" class="muted"></span>
    <button id="next" data-i18n="data.next"></button>
  </p>

  <details>
    <summary data-i18n="data.log_title"></summary>
    <ul id="log" class="log"></ul>
  </details>
  <p><button id="to-analysis" class="primary" data-i18n="data.next_step"></button></p>
</section>

<!-- 3. analysis -->
<section id="tab-analysis" class="panel" hidden>
  <h2 data-i18n="analysis.title"></h2>
  <form id="analysis-form">
    <fieldset id="profile-box">
      <legend data-i18n="analysis.profile"></legend>
      <p class="note" data-i18n="analysis.profile_hint"></p>
      <select id="a-profile"><option value="" data-i18n="analysis.profile_none"></option></select>
      <p id="a-profile-line" class="note" hidden></p>
    </fieldset>
    <div class="form-grid">
      <label class="wide"><span data-i18n="analysis.stage"></span>
        <select id="a-stage">
          <option value="production" data-i18n="analysis.stage_production"></option>
          <option value="preliminary" data-i18n="analysis.stage_preliminary"></option>
          <option value="machine" data-i18n="analysis.stage_machine"></option>
        </select></label>
      <label><span data-i18n="analysis.lsl"></span><input id="a-lsl" type="number" step="any"></label>
      <label><span data-i18n="analysis.usl"></span><input id="a-usl" type="number" step="any"></label>
      <label><span data-i18n="analysis.class"></span>
        <select id="a-class">
          <option value="" data-i18n="analysis.class_none"></option>
          <option value="critical" data-i18n="analysis.class_critical"></option>
          <option value="major" data-i18n="analysis.class_major"></option>
          <option value="minor" data-i18n="analysis.class_minor"></option>
          <option value="others" data-i18n="analysis.class_others"></option>
        </select></label>
      <label id="a-size-wrap"><span data-i18n="analysis.subgroup_size"></span>
        <input id="a-size" type="number" min="1" step="1">
        <small class="muted" data-i18n="analysis.subgroup_size_hint"></small></label>
      <label id="a-moving-wrap"><span data-i18n="analysis.moving_n"></span>
        <input id="a-moving" type="number" min="1" max="10" step="1" value="1">
        <small class="muted" data-i18n="analysis.moving_hint"></small></label>
    </div>

    <fieldset>
      <legend data-i18n="analysis.stability"></legend>
      <div class="form-grid">
        <label class="wide"><span data-i18n="analysis.model"></span>
          <select id="a-model">
            <option value="" data-i18n="analysis.model_none"></option>
            <option value="A1" data-i18n="analysis.model_A1"></option>
            <option value="A2" data-i18n="analysis.model_A2"></option>
            <option value="B" data-i18n="analysis.model_B"></option>
            <option value="C1" data-i18n="analysis.model_C1"></option>
            <option value="C2" data-i18n="analysis.model_C2"></option>
            <option value="C3" data-i18n="analysis.model_C3"></option>
            <option value="C4" data-i18n="analysis.model_C4"></option>
            <option value="D" data-i18n="analysis.model_D"></option>
          </select>
          <small class="muted" data-i18n="analysis.model_hint"></small></label>
        <label class="check wide"><input id="a-controlled" type="checkbox"><span data-i18n="analysis.controlled_stable"></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="analysis.rules"></legend>
      <p class="note" data-i18n="analysis.rules_hint"></p>
      <div class="rules">
        <label class="check"><input id="r-beyond" type="checkbox" checked><span data-i18n="analysis.rule_beyond_limits"></span></label>
        <label class="check"><input id="r-run" type="checkbox"><span data-i18n="analysis.rule_run"></span>
          <input id="r-run-n" type="number" min="2" max="50" value="7" class="small"></label>
        <label class="check"><input id="r-trend" type="checkbox"><span data-i18n="analysis.rule_trend"></span>
          <input id="r-trend-n" type="number" min="2" max="50" value="7" class="small"></label>
        <label class="check"><input id="r-middle" type="checkbox"><span data-i18n="analysis.rule_middle_third"></span></label>
        <label class="check"><input id="r-2of3" type="checkbox"><span data-i18n="analysis.rule_two_of_three"></span></label>
        <label class="check"><input id="r-4of5" type="checkbox"><span data-i18n="analysis.rule_four_of_five"></span></label>
        <label class="check"><input id="r-15" type="checkbox"><span data-i18n="analysis.rule_fifteen"></span></label>
      </div>
    </fieldset>

    <details>
      <summary data-i18n="analysis.advanced"></summary>
      <div class="form-grid">
        <label><span data-i18n="analysis.chart"></span>
          <select id="a-chart">
            <option value="auto" data-i18n="analysis.chart_auto"></option>
            <option value="xbar-s" data-i18n="analysis.chart_xbar-s"></option>
            <option value="xbar-r" data-i18n="analysis.chart_xbar-r"></option>
            <option value="median-r" data-i18n="analysis.chart_median-r"></option>
            <option value="imr" data-i18n="analysis.chart_imr"></option>
          </select></label>
        <label><span data-i18n="analysis.risk"></span>
          <select id="a-alpha">
            <option value="" data-i18n="analysis.risk_3sigma"></option>
            <option value="0.01" data-i18n="analysis.risk_99"></option>
          </select></label>
        <label><span data-i18n="analysis.stability_mode"></span>
          <select id="a-mode">
            <option value="random_range" data-i18n="analysis.mode_random_range"></option>
            <option value="strict" data-i18n="analysis.mode_strict"></option>
          </select></label>
        <label><span data-i18n="analysis.edition"></span>
          <select id="a-edition">
            <option value="draft" data-i18n="analysis.edition_draft"></option>
            <option value="final" data-i18n="analysis.edition_final"></option>
          </select></label>
        <label><span data-i18n="analysis.incomplete"></span>
          <select id="a-incomplete">
            <option value="drop" data-i18n="analysis.incomplete_drop"></option>
            <option value="error" data-i18n="analysis.incomplete_error"></option>
          </select></label>
        <label><span data-i18n="analysis.customer"></span><input id="a-customer" type="text" maxlength="200"></label>
      </div>
    </details>
    <fieldset>
      <legend data-i18n="analysis.distribution_title"></legend>
      <p class="note" data-i18n="analysis.distribution_hint"></p>
      <div class="form-grid">
        <label><span data-i18n="analysis.distribution"></span>
          <select id="a-dist">
            <option value="normal" data-i18n="dist.normal"></option>
            <option value="auto" data-i18n="analysis.dist_auto"></option>
            <option value="lognormal" data-i18n="dist.lognormal"></option>
            <option value="weibull" data-i18n="dist.weibull"></option>
            <option value="gamma" data-i18n="dist.gamma"></option>
            <option value="johnson_su" data-i18n="dist.johnson_su"></option>
            <option value="box_cox" data-i18n="dist.box_cox"></option>
            <option value="mixture" data-i18n="dist.mixture"></option>
            <option value="empirical" data-i18n="dist.empirical"></option>
          </select></label>
        <label id="a-method-wrap"><span data-i18n="analysis.method"></span>
          <select id="a-method">
            <option value="G" data-i18n="analysis.method_G"></option>
            <option value="Z" data-i18n="analysis.method_Z"></option>
          </select></label>
        <label id="a-boot-wrap"><span data-i18n="analysis.bootstrap"></span>
          <input id="a-boot" type="number" min="0" max="2000" step="1" value="200"></label>
        <label id="a-seed-wrap"><span data-i18n="analysis.seed"></span>
          <input id="a-seed" type="number" min="0" max="4294967295" step="1" value="20260701"></label>
      </div>
    </fieldset>
    <p><button id="run-btn" class="primary" type="submit" data-i18n="analysis.run"></button></p>
  </form>

  <div id="result" hidden>
    <h2 data-i18n="result.title"></h2>
    <ul id="r-warnings" class="warnings"></ul>
    <p id="r-counts" class="strong"></p>
    <div class="cards">
      <div class="card"><h3 data-i18n="result.names_title"></h3><p id="r-names" class="big"></p><p id="r-names-reason" class="muted"></p></div>
      <div class="card"><h3 data-i18n="result.stability_title"></h3><p id="r-stability" class="strong"></p><p id="r-alarm-points" class="muted"></p></div>
    </div>
    <h3 id="r-loc-title"></h3>
    <div id="chart-loc" class="chart"></div>
    <ul id="r-loc-alarms" class="alarms"></ul>
    <h3 id="r-var-title"></h3>
    <div id="chart-var" class="chart"></div>
    <ul id="r-var-alarms" class="alarms"></ul>
    <p id="r-moving" class="muted" hidden></p>
    <ul id="r-phases" class="muted"></ul>
    <p class="muted" data-i18n="result.no_spec_on_chart"></p>

    <div id="r-indices-block">
      <h3 data-i18n="result.indices_title"></h3>
      <div class="scroll"><table id="r-indices" class="grid"></table></div>
      <p id="r-stats" class="muted"></p>
      <p id="r-ppm" class="strong"></p>
      <p id="r-normality" class="muted"></p>
    </div>
    <div id="r-dist-block" class="card" hidden>
      <h3 data-i18n="result.dist_title"></h3>
      <p id="r-dist-line" class="strong"></p>
      <p id="r-dist-params" class="muted"></p>
      <p id="r-dist-boot" class="muted"></p>
      <div class="scroll"><table id="r-dist-cands" class="grid"></table></div>
      <p class="note" data-i18n="result.dist_cand_note"></p>
      <p id="r-dist-sample" class="muted"></p>
    </div>
    <div id="r-targets-block" hidden>
      <h3 data-i18n="result.targets_title"></h3>
      <div class="scroll"><table id="r-targets" class="grid"></table></div>
      <p id="r-target-note" class="muted"></p>
    </div>
    <div id="r-diagnosis-block" class="card" hidden>
      <h3 data-i18n="result.diagnosis_title"></h3>
      <p id="r-diagnosis" class="strong"></p>
      <p class="note" data-i18n="result.diagnosis_note"></p>
    </div>
    <div class="card">
      <h3 data-i18n="result.params_title"></h3>
      <p id="r-params" class="muted"></p>
      <p id="r-profile" class="muted"></p>
      <p id="r-fingerprint" class="muted"></p>
      <p id="r-hash" class="muted"></p>
    </div>
    <div class="card" id="report-card" data-needs="engineer">
      <h3 data-i18n="report.title"></h3>
      <p class="note" data-i18n="report.intro"></p>
      <div class="form-grid">
        <label><span data-i18n="report.language"></span>
          <select id="rp-language"><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
        <label><span data-i18n="report.process"></span><input id="rp-process" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.machine"></span><input id="rp-machine" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.site"></span><input id="rp-site" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.process_ref"></span><input id="rp-process_ref" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.machine_ref"></span><input id="rp-machine_ref" type="text" maxlength="2000"></label>
        <label class="wide"><span data-i18n="report.persons"></span><input id="rp-persons" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.part_name"></span><input id="rp-part_name" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.part_number"></span><input id="rp-part_number" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.characteristic"></span><input id="rp-characteristic" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.unit"></span><input id="rp-unit" type="text" maxlength="40"></label>
        <label><span data-i18n="report.target"></span><input id="rp-target" type="number" step="any"></label>
        <label class="wide"><span data-i18n="report.technical_conditions"></span><input id="rp-technical_conditions" type="text" maxlength="2000"></label>
        <label class="wide"><span data-i18n="report.deviations"></span><input id="rp-deviations" type="text" maxlength="2000"></label>
        <label class="wide"><span data-i18n="report.period_text"></span><input id="rp-period_text" type="text" maxlength="2000"></label>
        <label class="wide"><span data-i18n="report.sampling_frequency"></span><input id="rp-sampling_frequency" type="text" maxlength="2000"></label>
        <label><span data-i18n="report.uncertainty"></span><input id="rp-uncertainty" type="number" step="any" min="0"></label>
        <label><span data-i18n="report.coverage"></span><input id="rp-coverage_factor" type="number" step="any" min="1" value="2"></label>
        <label class="wide"><span data-i18n="report.recommendations"></span><textarea id="rp-recommendations" rows="3" maxlength="2000"></textarea></label>
        <div class="wide" id="rp-extra" hidden>
          <h4 data-i18n="report.extra_title"></h4>
          <div id="rp-extra-fields" class="form-grid"></div>
        </div>
        <p class="wide muted" id="rp-required-hint" hidden data-i18n="report.required_hint"></p>
      </div>
      <p class="row">
        <button id="rp-create" class="primary" data-i18n="report.create"></button>
      </p>
      <div id="rp-out" hidden>
        <p id="rp-created" class="strong ok"></p>
        <p class="row">
          <a id="rp-open" class="button" target="_blank" rel="noopener" data-i18n="report.open"></a>
          <a id="rp-download" class="button" data-i18n="report.download"></a>
          <a id="rp-archive" class="button" data-i18n="report.archive"></a>
          <a id="rp-excel" class="button" data-i18n="report.excel"></a>
        </p>
        <p id="rp-digest" class="muted"></p>
        <p class="muted" data-i18n="report.pdf_hint"></p>
      </div>
    </div>
  </div>
</section>

<!-- tools -->
<section id="tab-tools" class="panel" hidden>
  <h2 data-i18n="tools.title"></h2>
  <div class="card">
    <h3 data-i18n="tools.targets_title"></h3>
    <div class="form-grid">
      <label><span data-i18n="tools.stage"></span>
        <select id="t-stage">
          <option value="machine" data-i18n="analysis.stage_machine"></option>
          <option value="preliminary" data-i18n="analysis.stage_preliminary"></option>
          <option value="production" data-i18n="analysis.stage_production"></option>
        </select></label>
      <label><span data-i18n="tools.class"></span>
        <select id="t-class">
          <option value="critical" data-i18n="analysis.class_critical"></option>
          <option value="major" selected data-i18n="analysis.class_major"></option>
          <option value="minor" data-i18n="analysis.class_minor"></option>
          <option value="others" data-i18n="analysis.class_others"></option>
        </select></label>
      <label><span data-i18n="tools.n"></span><input id="t-n" type="number" min="2" step="1" value="30"></label>
      <label><span data-i18n="tools.confidence"></span>
        <select id="t-conf">
          <option value="0.95">95 %</option>
          <option value="0.99">99 %</option>
          <option value="0.999">99.9 %</option>
          <option value="0.9999" selected>99.99 %</option>

        <label><span data-i18n="admin.pf_tgt"></span><input id="pf-tgt" type="number" step="any" min="0" max="1"></label>
        <label><span data-i18n="admin.pf_stab"></span><input id="pf-stab" type="number" step="any" min="0" max="1"></label>
        <label><span data-i18n="admin.pf_edition"></span>
          <select id="pf-edition"><option value="" data-i18n="admin.pf_default"></option>
            <option value="draft" data-i18n="analysis.edition_draft"></option><option value="final" data-i18n="analysis.edition_final"></option></select></label>
        <label><span data-i18n="admin.pf_mode"></span>
          <select id="pf-mode"><option value="" data-i18n="admin.pf_default"></option>
            <option value="random_range" data-i18n="analysis.mode_random_range"></option><option value="strict" data-i18n="analysis.mode_strict"></option></select></label>
      </div>
      <label class="check"><input id="pf-rules-on" type="checkbox"><span data-i18n="admin.pf_rules_on"></span></label>
      <div id="pf-rules" class="checks">
        <label class="check"><input id="pf-r-beyond" type="checkbox" checked><span data-i18n="analysis.rule_beyond_limits"></span></label>
        <label class="check"><input id="pf-r-run" type="checkbox"><span data-i18n="analysis.rule_run"></span>
          <input id="pf-r-run-n" type="number" min="2" max="50" value="7" class="small"></label>
        <label class="check"><input id="pf-r-trend" type="checkbox"><span data-i18n="analysis.rule_trend"></span>
          <input id="pf-r-trend-n" type="number" min="2" max="50" value="7" class="small"></label>
        <label class="check"><input id="pf-r-middle" type="checkbox"><span data-i18n="analysis.rule_middle_third"></span></label>
        <label class="check"><input id="pf-r-2of3" type="checkbox"><span data-i18n="analysis.rule_two_of_three"></span></label>
        <label class="check"><input id="pf-r-4of5" type="checkbox"><span data-i18n="analysis.rule_four_of_five"></span></label>
        <label class="check"><input id="pf-r-15" type="checkbox"><span data-i18n="analysis.rule_fifteen"></span></label>
      </div>
      <p class="note" data-i18n="admin.pf_targets"></p>
      <div class="scroll"><table id="pf-targets" class="grid"></table></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="admin.pf_report"></legend>
      <div class="form-grid">
        <label><span data-i18n="admin.pf_org"></span><input id="pf-org" type="text" maxlength="200"></label>
        <label><span data-i18n="admin.pf_title"></span><input id="pf-title" type="text" maxlength="200"></label>
        <label><span data-i18n="admin.pf_form"></span><input id="pf-form" type="text" maxlength="100"></label>
        <label><span data-i18n="admin.pf_rev"></span><input id="pf-rev" type="text" maxlength="50"></label>
        <label class="wide"><span data-i18n="admin.pf_footer"></span><input id="pf-footer" type="text" maxlength="500"></label>
        <label><span data-i18n="admin.pf_lang"></span>
          <select id="pf-lang"><option value="" data-i18n="admin.pf_lang_any"></option>
            <option value="zh-TW">繁體中文</option><option value="en">English</option></select></label>
        <label class="check"><input id="pf-accent-on" type="checkbox"><span data-i18n="admin.pf_accent_on"></span>
          <input id="pf-accent" type="color" value="#1f5fbf"></label>
      </div>
      <p class="row">
        <label class="filebtn"><input type="file" id="pf-logo-file" accept="image/png,image/jpeg"><span data-i18n="admin.pf_logo"></span></label>
        <img id="pf-logo-preview" class="logo-preview" alt="" hidden>
        <button id="pf-logo-remove" hidden data-i18n="admin.pf_logo_remove"></button>
      </p>
      <label class="check"><input id="pf-el21" type="checkbox" checked><span data-i18n="admin.pf_el21"></span></label>
      <label class="check"><input id="pf-el22" type="checkbox" checked><span data-i18n="admin.pf_el22"></span></label>
      <h4 data-i18n="admin.pf_required"></h4>
      <div id="pf-required" class="checks"></div>
      <h4 data-i18n="admin.pf_extra"></h4>
      <div id="pf-extra"></div>
      <p><button id="pf-extra-add" data-i18n="admin.pf_extra_add"></button></p>
    </fieldset>
    <p class="row">
      <button id="pf-save" class="primary" data-i18n="admin.pf_save"></button>
      <button id="pf-cancel" data-i18n="admin.pf_cancel"></button>
    </p>
    <p id="pf-msg" class="strong ok"></p>
  </div>
  <h3 data-i18n="admin.audit"></h3>
  <p class="note" data-i18n="admin.audit_note"></p>
  <p class="row"><button id="audit-verify" data-i18n="admin.audit_verify"></button><span id="audit-verdict" class="strong"></span></p>
  <div class="scroll"><table id="audit-log" class="grid"></table></div>
</section>
</main>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
