[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spc"
version = "0.1.0"
description = "SPC engine following AIAG-VDA SPC Manual (2026), ISO 7870 and ISO 22514"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "openpyxl>=3.1",
]
opcua = [
    "asyncua>=1.1",
]
sign = [
    "cryptography>=42",
]
excel = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "openpyxl>=3.1",
    "formulas>=1.2",
    "asyncua>=1.1",
    "cryptography>=42",
]

[project.scripts]
spc-serve = "spc.api.__main__:main"
spc-admin = "spc.admin:main"
spc-sign = "spc.signing.__main__:main"
spc-setup = "spc.setup:main"
spc-qualify = "spc.qualification.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spc" = ["RELEASE.json"]
"spc.web" = ["static/*", "static/i18n/*"]
"spc.validation" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
